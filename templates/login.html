{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block body %}
<div class="login-wrap" style="margin:-20px -16px -48px">
  <form class="login-card" method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <h1>销售拜访管理系统</h1>
    <p class="sub">客户拜访 · 出差报告 · 周报月报</p>
    {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    <div class="field"><label>用户名</label><input name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label>密码</label><input name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn">登 录</button>
  </form>
</div>
{% endblock %}
