{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block body %}
<div class="card" style="max-width:440px">
  <h1>修改密码</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field"><label>原密码</label><input name="old" type="password" required></div><br>
    <div class="field"><label>新密码</label><input name="new" type="password" required minlength="8">
      <span class="hint">至少 8 位, 同时包含字母和数字</span></div><br>
    <div class="field"><label>确认新密码</label><input name="new2" type="password" required></div>
    <div class="actions"><button class="btn">保存</button></div>
  </form>
</div>
{% endblock %}
